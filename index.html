<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب المجمع والمحطة</title>
<meta name="theme-color" content="#0b5a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الحساب">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style id="css">
/* Layout: emerald gradient header card, sticky tab bar, white rounded cards on a pale mint field (single light theme, like the school portal) */
:root{
  --bg:#eef5f2; --surface:#ffffff; --ink:#12332c; --muted:#62807a; --line:#dde9e5;
  --accent:#0e7a64; --accent-deep:#0a4a40; --accent-soft:#e2f3ed;
  --sand:#fbf1dc; --sky:#e7f0fb; --rose:#fbe8e4;
  --good:#11865c; --warn:#b97c0c; --bad:#c03d2b;
  --font:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(900px 400px at 100% -10%,#dff1ea 0,transparent 60%);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.wrap>*{min-width:0}
body{overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7cc9b3;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 24px;color:#fff;background:linear-gradient(135deg,#127f68 0%,#0b5a4d 55%,#0a4a40 100%);box-shadow:0 14px 30px -14px rgba(10,74,64,.55)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.hero:before{width:260px;height:260px;left:-60px;top:-110px}
.hero:after{width:180px;height:180px;left:40px;bottom:-120px}
.hero-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:12.5px;font-weight:700}
.chip svg{width:14px;height:14px}
.hero h1{margin:10px 0 2px;font-size:30px;font-weight:800;line-height:1.2;text-wrap:balance}
.hero h1 span{color:#ffe6a6}
.hero p{margin:0;font-size:13.5px;opacity:.9}
.hero-badge{flex:none;width:88px;height:88px;border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 8px rgba(255,255,255,.05)}
.hero-badge svg{width:42px;height:42px}
.hero-badge i{position:absolute;bottom:-8px;left:-8px;width:34px;height:34px;border-radius:12px;background:#fbe7b5;display:grid;place-items:center;color:#7a5a12}
.hero-badge i svg{width:18px;height:18px}
.save{position:relative;margin-top:14px;display:flex;gap:8px;align-items:center;font-size:12.5px;opacity:.95}
.dot{width:8px;height:8px;border-radius:50%;background:#8ef0c8}
.save.busy .dot{background:#ffd56b}
.save.err .dot{background:#ff9c8c}

/* nav */
.nav{position:sticky;top:8px;z-index:5;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:5px;border-radius:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 6px 18px -10px rgba(16,60,50,.35);border:1px solid var(--line)}
.nav button{border:0;background:transparent;border-radius:13px;padding:8px 4px;display:grid;justify-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--muted)}
.nav button svg{width:20px;height:20px}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-deep)}

/* cards */
.card{background:var(--surface);border-radius:22px;padding:20px;box-shadow:0 8px 24px -16px rgba(16,60,50,.35);border:1px solid #edf3f1}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tile{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.05)}
.tile svg{width:24px;height:24px}
.t-mint{background:var(--accent-soft);color:var(--accent)}
.t-sand{background:var(--sand);color:#a3720c}
.t-sky{background:var(--sky);color:#2f6fb3}
.t-rose{background:var(--rose);color:#b2442f}
.card-head h2{margin:0;font-size:19px;font-weight:800}
.card-head p{margin:0;font-size:13px;color:var(--muted)}
.card-head .grow{flex:1;min-width:0}
.section-title{margin:6px 4px -4px;font-size:16px;font-weight:800;color:var(--accent-deep)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:var(--surface);border-radius:20px;padding:16px;border:1px solid #edf3f1;box-shadow:0 8px 22px -18px rgba(16,60,50,.4);display:grid;gap:6px}
.kpi .tile{width:38px;height:38px;border-radius:12px}
.kpi .tile svg{width:20px;height:20px}
.kpi small{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi b{font-size:22px;font-weight:800;letter-spacing:-.2px}
.kpi b em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.kpi.main{grid-column:1/-1;background:linear-gradient(135deg,#f3fbf8,#ffffff)}

.bar{height:10px;border-radius:99px;background:#e8f0ed;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#16a37f,#0e7a64)}
.bar-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}

.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.m{border:1px solid var(--line);background:#fafdfc;border-radius:14px;padding:8px 4px;text-align:center;font-size:12.5px;font-weight:700;display:grid;gap:4px;justify-items:center}
.m i{width:10px;height:10px;border-radius:50%;background:#cfdcd8}
.m.full i{background:var(--good)}
.m.part i{background:var(--warn)}
.m.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* rows */
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:#fbfdfc}
.av{flex:none;width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-weight:800;font-size:17px}
.row .info{flex:1;min-width:0}
.row .info b{display:block;font-size:15.5px;overflow-wrap:anywhere}
.row .info small{color:var(--muted);font-size:12.5px;display:block}
.row .amt{text-align:left;font-weight:800;white-space:nowrap}
.row .amt small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.icon-btn{border:1px solid var(--line);background:#fff;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.del:hover{color:var(--bad);border-color:#f0c9c1}
.actions{display:flex;gap:6px}

.pay{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)}
.pay svg{width:16px;height:16px}
.pay.on{background:var(--good);border-color:var(--good);color:#fff}

.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#139073,#0c6b58);color:#fff;box-shadow:0 4px 0 #0a4a40,0 10px 18px -10px rgba(10,74,64,.6)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0a4a40}
.btn svg{width:18px;height:18px}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--accent-deep);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#d1513e,#ad3524);box-shadow:0 4px 0 #84261a}
.btn.small{padding:8px 12px;font-size:13px;border-radius:12px}

.field{display:grid;gap:6px}
.field label{font-size:13.5px;font-weight:700}
.input{width:100%;border:1.5px solid var(--line);background:#f7fbfa;border-radius:15px;padding:12px 14px;font-size:15px}
.input:focus{border-color:#7cc9b3;background:#fff;outline:none;box-shadow:0 0 0 4px #e2f3ed}
textarea.input{min-height:80px;resize:vertical}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini div{border-radius:15px;padding:12px;background:#f6faf9;border:1px solid var(--line)}
.mini small{display:block;color:var(--muted);font-size:12px}
.mini b{font-size:18px;font-weight:800}
.neg{color:var(--bad)}
.pos{color:var(--good)}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:#fbfdfc;width:100%;text-align:right}
.toggle b{display:block;font-size:15px}
.toggle small{color:var(--muted);font-size:12.5px}
.sw{flex:none;width:50px;height:28px;border-radius:99px;background:#d5e1dd;position:relative;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:right .2s}
.toggle.on{border-color:#9ad7c2;background:#f0faf6}
.toggle.on .sw{background:var(--good)}
.toggle.on .sw:after{right:25px}

.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--sand);color:#6d4d07;font-size:13.5px}
.note svg{flex:none;width:18px;height:18px;margin-top:2px}
.foot{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.foot svg{width:14px;height:14px}
.empty{text-align:center;color:var(--muted);padding:18px;font-size:14px}
.warnline{color:var(--warn);font-size:13px;font-weight:700}

/* dialog */
.overlay{position:fixed;inset:0;background:rgba(10,40,34,.45);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{width:min(460px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);display:grid;gap:16px;max-height:90vh;overflow:auto}
.dialog h3{margin:0;font-size:19px;font-weight:800}
.dialog .btns{display:flex;gap:10px}
.dialog .btns .btn{flex:1}

#root.loading>*:not(.hero){opacity:.55;pointer-events:none}

/* daily journal calendar */
.dgroup{margin-top:16px}
.dg-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:#eef6f3;margin-bottom:8px;font-size:14px}
.dg-head b{font-size:15px;font-weight:800;color:var(--accent-deep)}
.dg-head span{color:var(--muted);font-size:13px}
.dg-head em{margin-inline-start:auto;font-style:normal;font-weight:800;display:flex;gap:10px}
.dg-head em i{font-style:normal}
.stamp{margin-bottom:12px}
.nw{white-space:nowrap;display:inline-block}
.hj{display:block;font-size:12px;color:var(--muted);font-weight:500}
.xl td.c-date .hj{padding:0 10px 4px;font-size:11px;margin-top:-6px}
.dg-date{display:grid;line-height:1.25}
.dg-date small{font-size:12px;color:var(--muted);font-weight:500}
.hero p.today{margin:2px 0 6px;font-size:13px;font-weight:700;opacity:1;color:#e6fff5}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
.day-head h3{margin:0;font-size:17px;font-weight:800}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sky);color:#2f6fb3;margin-inline-start:6px;vertical-align:middle}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:11px;font-weight:800;cursor:pointer;background:#f7fbfa}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff}
.seg label.out:has(input:checked){background:var(--bad);border-color:var(--bad)}
.seg label:has(input:focus-visible){outline:3px solid #7cc9b3;outline-offset:2px}

.kpi,.kpi-card{position:relative}
.pen{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.pen svg{width:16px;height:16px}
.pen:hover{color:var(--accent-deep);border-color:#9ad7c2}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.6}

.hero-foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.hero-foot .save{margin:0}
.who{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.95;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.who button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:#eef6f3}
.seg2 button{border:0;background:transparent;border-radius:12px;padding:10px;font-weight:800;color:var(--muted)}
.seg2 button.on{background:#fff;color:var(--accent-deep);box-shadow:0 2px 8px -4px rgba(10,74,64,.35)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:10px 0 0;display:block}
.btn[disabled]{opacity:.6;pointer-events:none}
.tag.st-pending{background:var(--sand);color:#8a6110}
.tag.st-approved{background:var(--accent-soft);color:var(--accent-deep)}
.tag.st-rejected{background:var(--rose);color:var(--bad)}
label.btn{cursor:pointer}

.nav{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 auto;min-width:58px;padding:8px 6px;white-space:nowrap}

.ro-hide{display:none!important}
.ro-static{pointer-events:none;cursor:default}
.pay.ro-static:not(.on){opacity:.7}
#root input:disabled,#root textarea:disabled{opacity:1;color:var(--ink);background:transparent;cursor:default}

.cx-switch{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px;padding:5px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18)}
.cx-switch button{border:0;background:transparent;color:#e6fff5;border-radius:12px;padding:9px 4px;font-weight:800;font-size:13.5px;line-height:1.3}
.cx-switch button.on{background:#fff;color:var(--accent-deep);box-shadow:0 4px 12px -6px rgba(0,0,0,.4)}

@media (max-width:480px){.prow{flex-wrap:wrap}.prow .info{flex:1 1 calc(100% - 60px)}.prow .amt{margin-inline-start:54px;flex:1;text-align:right}}

.acc-row{width:100%;text-align:right;cursor:pointer;font:inherit;color:inherit}
.acc-row:hover{border-color:#9ad7c2;background:#f3faf7}
.chev{color:var(--muted);font-size:22px;font-weight:700;padding-inline-start:4px}
.seg3{grid-template-columns:repeat(3,1fr);margin-bottom:12px}
.filter-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent-deep);font-size:13px;font-weight:700;margin-bottom:12px}
.filter-chip button{border:0;background:#fff;border-radius:50%;width:24px;height:24px;font-size:12px;color:var(--muted)}
.back{padding:0 0 10px}

.export-bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.export-bar .btn svg{width:16px;height:16px}
#print-area{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;background-image:none!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;color:#12332c;font-family:var(--font);direction:rtl}
  .pr-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0b5a4d;padding-bottom:10px;margin-bottom:14px}
  .pr-cx{font-size:13px;color:#0e7a64;font-weight:700}
  #print-area h1{margin:2px 0;font-size:24px}
  #print-area p{margin:0;color:#62807a;font-size:13px}
  .pr-stamp{font-size:11px;color:#62807a}
  .pr-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .pr-meta div{border:1px solid #dde9e5;border-radius:8px;padding:8px 10px}
  .pr-meta small{display:block;color:#62807a;font-size:11px}
  .pr-meta b{font-size:15px}
  #print-area h2{font-size:16px;margin:16px 0 6px;color:#0a4a40}
  #print-area table{width:100%;border-collapse:collapse;font-size:12px;page-break-inside:auto}
  #print-area tr{page-break-inside:avoid}
  #print-area th{background:#e6f3ee;color:#0a4a40;text-align:right;padding:6px 8px;border:1px solid #d5e5df}
  #print-area td{padding:5px 8px;border:1px solid #e3ece9;text-align:right;font-variant-numeric:tabular-nums}
  #print-area tfoot td{font-weight:800;background:#f2f8f6}
}

/* excel-like ledger */
.sheet{overflow-x:auto;border:1px solid #cfe0da;border-radius:14px;background:#fff}
.xl{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
.xl th,.xl td{border:1px solid #dbe7e3;padding:0;height:40px}
.xl thead th{background:#e6f3ee;color:var(--accent-deep);font-weight:800;font-size:13.5px;padding:0 10px}
.xl thead th.n,.xl td.n{width:40px;text-align:center;background:#f3f8f6;color:var(--muted);font-size:12.5px;font-weight:700}
.xl input{width:100%;height:39px;border:0;background:transparent;padding:0 10px;font-size:14px}
.xl input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#f4fbf8}
.xl input.amt{text-align:left;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.xl input::-webkit-outer-spin-button,.xl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.xl .c-date{width:150px}
.xl .c-amt{width:120px}
.xl .c-in input{color:var(--good)}
.xl .c-out input{color:var(--bad)}
.xl td.bal{width:130px;padding:0 10px;text-align:left;font-weight:800;font-variant-numeric:tabular-nums;background:#fafdfc}
.xl td.x{width:44px;text-align:center}
.xl td.x button{border:0;background:transparent;color:#a9bcb7;width:36px;height:36px;border-radius:9px;display:inline-grid;place-items:center}
.xl td.x button:hover{color:var(--bad);background:var(--rose)}
.xl td.x svg{width:16px;height:16px}
.xl tfoot td{background:#e6f3ee;font-weight:800;padding:0 10px;font-variant-numeric:tabular-nums;text-align:left}
.xl tfoot td.lbl{text-align:right;color:var(--accent-deep)}
.sheet-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

@media (max-width:480px){
  .xl{min-width:540px;font-size:13px}
  .xl .c-date{width:122px}
  .xl .c-amt,.xl td.bal{width:92px}
  .xl input{padding:0 6px;font-size:13px}
  .xl td.bal,.xl tfoot td{padding:0 6px}

function dialog(html,onOk){
  var md=document.getElementById('modal');
  md.innerHTML='<div class="overlay"><form class="dialog" id="dlg" novalidate>'+html+'</form></div>';
  var f=document.getElementById('dlg');
  var first=f.querySelector('input');if(first)first.focus();
  f.addEventListener('submit',function(ev){ev.preventDefault();if(onOk()!==false)close();});
  f.querySelectorAll('[data-cancel]').forEach(function(x){x.addEventListener('click',function(){close();if(x.dataset.goto){view=x.dataset.goto;rememberView();try{history.replaceState(null,'','#'+view);}catch(e){}render();window.scrollTo(0,0);}});});
  md.querySelector('.overlay').addEventListener('click',function(ev){if(ev.target===this)close();});
  function onKey(ev){if(ev.key==='Escape')close();}
  document.addEventListener('keydown',onKey);
  function close(){md.innerHTML='';document.removeEventListener('keydown',onKey);flushRemote();}
}

  if(authTab==='up'&&!nm){authErr='اكتب اسمك عشان يعرفك المدير.';render();return;}
  authBusy=true;authErr='';render();
  (authTab==='up'?FB.signUp(em,pw,nm).then(function(c){if(c.user.email.toLowerCase()===ADMIN_EMAIL)FB.verify();if(nm)FB.setUser(c.user.uid,{email:c.user.email,name:nm,status:'pending',created:Date.now()}).catch(function(){});}):FB.signIn(em,pw))
    .catch(function(e){authBusy=false;authErr=errText(e);render();});
});
document.addEventListener('change',function(ev){
  if(authUser&&approved()&&!isAdmin()&&ev.target.closest('#root')){render();return;}
  if(ev.target.id==='restore-file'){var f=ev.target.files&&ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var data=JSON.parse(rd.result);confirmBox('استرجاع النسخة؟ البيانات اللي في الملف بتنضاف وتحدّث الموجود.','استرجاع',function(){importData(data,false);});}catch(e){setSave('err','الملف مو نسخة احتياطية صحيحة');}};rd.readAsText(f);ev.target.value='';return;}
  var id=ev.target.id;
  if(id==='stamp-date'){var sp=ev.target.value.split('-');if(sp.length===3&&+sp[1]-1===sel){selDay=+sp[2];try{sessionStorage.setItem('selDay',String(selDay));}catch(e){}var sh=document.getElementById('stamp-hj');if(sh)sh.textContent=hijri(ev.target.value)?'يوافق '+hijri(ev.target.value)+'هـ':'';}else{ev.target.value=stampKey();}return;}
  if(id==='rep'){S.months[sel].repairs=numv('rep');if(S.months[sel].repairs>0)S.months[sel].repairsOn=S.months[sel].repairsOn||stampKey();else delete S.months[sel].repairsOn;commit();}
  if(id==='notes'){S.months[sel].notes=ev.target.value;commit();}
  var ld=ev.target.dataset&&ev.target.dataset.l;
  if(ld){var r=S.ledger.find(function(x){return x.id===ld;});if(!r)return;var f=ev.target.dataset.f;var v=ev.target.value;
    if(f==='in'||f==='out'){v=parseAmt(v);ev.target.value=amt(v);}else{v=v.trim();}
    r[f]=v;if(f==='date'){var hj=document.querySelector('[data-hj="'+ld+'"]');if(hj)hj.textContent=hijri(v)?hijri(v)+'هـ':'';}refreshLedger();commit(true);}
});
document.addEventListener('keydown',function(ev){var pn=ev.target.closest&&ev.target.closest('[data-card]');if(pn&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();cardForm(pn.dataset.card);}});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(VIEWS.indexOf(h)>=0){view=h;rememberView();render();}});
S=build();S0=clone(S);
render();
if(window.FB){fbReady=true;FB.onAuth(onAuthChange);}
})();
</script>

<script>
if('serviceWorker' in navigator){
  var hadCtl=!!navigator.serviceWorker.controller, reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtl&&!reloaded){reloaded=true;location.reload();}});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){r.update();}).catch(function(){});});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){navigator.serviceWorker.getRegistration().then(function(r){r&&r.update();});}});
}
